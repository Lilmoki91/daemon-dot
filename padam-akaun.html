<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padam Akaun Q-TOTK</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --card: #16213e;
            --accent: #e94560;
            --text: #eee;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: var(--card);
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .warning {
            background: rgba(233, 69, 96, 0.1);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px 0;
        }
        .btn-delete {
            background: var(--accent);
            color: white;
        }
        .btn-cancel {
            background: rgba(255,255,255,0.1);
            color: var(--text);
        }
        .btn-telegram {
            background: #0088cc;
            color: white;
        }
        #status {
            margin: 15px 0;
            font-size: 14px;
        }
        .success { color: #00ff88; }
        .error { color: #e94560; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🗑️ Padam Akaun Q-TOTK</h2>
        <p style="color: #94a3b8; margin: 10px 0;">Untuk pengguna yang terlupa 12 kata frasa</p>
        
        <!-- Telegram Login Widget -->
        <div id="telegram-login"></div>
        
        <div class="warning">
            ⚠️ <strong>AMARAN:</strong> Tindakan ini TIDAK BOLEH DIUNDUR!<br><br>
            • CID anda akan di-unpin dari IPFS<br>
            • Rekod anda akan dipadam dari indeks<br>
            • DID Quantum anda menjadi tidak bermakna
        </div>
        
        <button class="btn btn-telegram" onclick="loginWithTelegram()">
            🔐 Log Masuk dengan Telegram
        </button>
        
        <div id="status"></div>
        
        <button class="btn btn-delete" id="btn-delete" onclick="confirmDelete()" disabled>
            ✅ YA, PADAM AKAUN SAYA
        </button>
        
        <button class="btn btn-cancel" onclick="cancelDelete()">
            ❌ BATAL
        </button>
    </div>

    <script>
        let telegramUser = null;

        // Fungsi login dengan Telegram Widget
        async function loginWithTelegram() {
            const status = document.getElementById('status');
            status.innerHTML = '<p>Memuatkan Telegram Login Widget...</p>';
            
            // Guna Telegram WebApp API
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready();
                
                telegramUser = tg.initDataUnsafe?.user;
                
                if (telegramUser) {
                    status.innerHTML = `<p class="success">✅ Log masuk sebagai: ${telegramUser.first_name} (ID: ${telegramUser.id})</p>`;
                    document.getElementById('btn-delete').disabled = false;
                } else {
                    status.innerHTML = '<p class="error">❌ Gagal dapatkan data Telegram. Sila cuba lagi.</p>';
                }
            } else {
                // Fallback: minta user taip ID Telegram
                const userId = prompt("Sila masukkan ID Telegram anda:");
                const phone = prompt("Sila masukkan nombor telefon anda (contoh: +60123456789):");
                
                if (userId && phone) {
                    telegramUser = { id: userId, phone: phone };
                    status.innerHTML = `<p class="success">✅ Data diterima: ID ${userId}</p>`;
                    document.getElementById('btn-delete').disabled = false;
                }
            }
        }

        // Fungsi padam akaun
        async function confirmDelete() {
            if (!telegramUser) {
                alert('Sila log masuk dengan Telegram terlebih dahulu.');
                return;
            }
            
            if (!confirm('⚠️ AMARAN: Tindakan ini TIDAK BOLEH DIUNDUR! Adakah anda pasti mahu PADAM akaun anda?')) {
                return;
            }
            
            const phone = telegramUser.phone || prompt("Sila masukkan nombor telefon anda (contoh: +60123456789):");
            
            const data = {
                action: "verify_and_delete",
                telegram_id: String(telegramUser.id),
                phone_number: phone
            };
            
            // Hantar data ke bot melalui WebApp API
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.sendData(JSON.stringify(data));
            } else {
                // Fallback: papar arahan
                alert('Sila hubungi bot secara manual: /padamakaun');
            }
        }

        function cancelDelete() {
            if (window.Telegram && window.Telegram.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.close();
            }
            window.close();
        }
    </script>
</body>
</html>
