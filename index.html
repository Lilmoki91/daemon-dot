<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padam Akaun Q-TOTK</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --card: #16213e;
            --accent: #e94560;
            --text: #eee;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: var(--card);
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .warning {
            background: rgba(233, 69, 96, 0.1);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px 0;
        }
        .btn-delete {
            background: var(--accent);
            color: white;
        }
        .btn-cancel {
            background: rgba(255,255,255,0.1);
            color: var(--text);
        }
        #telegram-widget {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        #status {
            margin: 15px 0;
            font-size: 14px;
        }
        .success { color: #00ff88; }
        .error { color: #e94560; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🗑️ Padam Akaun Q-TOTK</h2>
        <p style="color: #94a3b8; margin: 10px 0;">Untuk pengguna yang terlupa 12 kata frasa</p>
        
        <!-- 🆕 Telegram Login Widget RASMI -->
        <div id="telegram-widget">
            <script async 
                src="https://telegram.org/js/telegram-widget.js?22"
                data-telegram-login="Hadamard_bot"
                data-size="large"
                data-auth-url="https://lilmoki91.github.io/daemon-dot/auth-callback.html"
                data-request-access="write">
            </script>
        </div>
        
        <div class="warning">
            ⚠️ <strong>AMARAN:</strong> Tindakan ini TIDAK BOLEH DIUNDUR!<br><br>
            • CID anda akan di-unpin dari IPFS<br>
            • Rekod anda akan dipadam dari indeks<br>
            • DID Quantum anda menjadi tidak bermakna
        </div>
        
        <div id="status"></div>
        
        <button class="btn btn-delete" id="btn-delete" onclick="confirmDelete()" disabled>
            ✅ YA, PADAM AKAUN SAYA
        </button>
        
        <button class="btn btn-cancel" onclick="cancelDelete()">
            ❌ BATAL
        </button>
    </div>

    <!-- 🆕 Telegram WebApp SDK (untuk dapatkan data pengguna) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <script>
        let telegramUser = null;

        // Inisialisasi Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        // Dapatkan data pengguna dari Telegram WebApp
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            telegramUser = tg.initDataUnsafe.user;
            document.getElementById('status').innerHTML = 
                `<p class="success">✅ Log masuk sebagai: ${telegramUser.first_name} (ID: ${telegramUser.id})</p>`;
            document.getElementById('btn-delete').disabled = false;
            
            // Sembunyikan widget login Telegram (kerana sudah auto-login via WebApp)
            document.getElementById('telegram-widget').style.display = 'none';
        }

        // Fungsi padam akaun
        async function confirmDelete() {
            if (!telegramUser) {
                alert('❌ Sila log masuk dengan Telegram terlebih dahulu.');
                return;
            }
            
            if (!confirm('⚠️ AMARAN: Tindakan ini TIDAK BOLEH DIUNDUR! Adakah anda pasti mahu PADAM akaun anda?')) {
                return;
            }
            
            const phone = prompt("📱 Sila masukkan nombor telefon anda (contoh: +60123456789):\n\n(Ini diperlukan untuk pengesahan akhir)");
            
            if (!phone) {
                alert('❌ Nombor telefon diperlukan.');
                return;
            }
            
            const data = {
                action: "verify_and_delete",
                telegram_id: String(telegramUser.id),
                phone_number: phone
            };
            
            // Hantar data ke bot melalui WebApp API
            tg.sendData(JSON.stringify(data));
            
            // Papar mesej menunggu
            document.getElementById('status').innerHTML = 
                '<p class="success">⏳ Memproses pemadaman... Sila tunggu.</p>';
            document.getElementById('btn-delete').disabled = true;
        }

        function cancelDelete() {
            tg.close();
        }
    </script>
</body>
</html>
