<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padam Akaun Q-TOTK</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background: #1a1a2e;
            color: #e2e8f0;
            text-align: center;
            padding: 20px;
        }
        button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-delete { background: #e94560; color: white; }
        .btn-cancel { background: #6c63ff; color: white; }
    </style>
</head>
<body>
    <h2>🗑️ Padam Akaun Q-TOTK</h2>
    <p>⚠️ Tindakan ini TIDAK BOLEH DIUNDUR!</p>
    <p>Anda boleh memadam akaun jika ID Telegram dan nombor telefon anda sepadan dengan rekod.</p>
    
    <button class="btn-delete" onclick="confirmDelete()">✅ YA, PADAM AKAUN</button>
    <button class="btn-cancel" onclick="cancelDelete()">❌ BATAL</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        // Dapatkan parameter dari URL
        const params = new URLSearchParams(window.location.search);
        const uid = params.get('uid') || '';
        const phone_hash = params.get('phone_hash') || '';
        const did = params.get('did') || '';
        
        function confirmDelete() {
            tg.sendData(JSON.stringify({
                action: 'confirm_delete',
                uid: uid,
                did: did,
                phone_hash: phone_hash
            }));
        }
        
        function cancelDelete() {
            tg.sendData(JSON.stringify({
                action: 'cancel_delete',
                uid: uid
            }));
        }
    </script>
</body>
</html>
