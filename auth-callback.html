<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengesahan Q-TOTK</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --card: #16213e;
            --accent: #6c63ff;
            --text: #eee;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: var(--card);
            border-radius: 16px;
            padding: 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        .success-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px 0;
            background: var(--accent);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✅</div>
        <h2>Pengesahan Berjaya!</h2>
        <p style="color: #94a3b8; margin: 10px 0;">
            Anda telah berjaya log masuk melalui Telegram.
        </p>
        <p style="color: #94a3b8; margin: 10px 0;">
            Sila kembali ke WebApp atau bot Telegram untuk meneruskan.
        </p>
        
        <button class="btn" onclick="goBackToBot()">
            🤖 Kembali ke Bot
        </button>
        <button class="btn" style="background: rgba(255,255,255,0.1);" onclick="window.close()">
            ❌ Tutup
        </button>
    </div>

    <script>
        // Dapatkan parameter dari URL callback
        const urlParams = new URLSearchParams(window.location.search);
        const telegramId = urlParams.get('id');
        const firstName = urlParams.get('first_name');
        const username = urlParams.get('username');
        const photoUrl = urlParams.get('photo_url');
        const authDate = urlParams.get('auth_date');
        const hash = urlParams.get('hash');

        // Simpan data dalam localStorage untuk WebApp
        if (telegramId) {
            localStorage.setItem('qtok_telegram_id', telegramId);
            localStorage.setItem('qtok_telegram_first_name', firstName || '');
            localStorage.setItem('qtok_telegram_username', username || '');
            localStorage.setItem('qtok_telegram_photo_url', photoUrl || '');
            localStorage.setItem('qtok_telegram_auth_date', authDate || '');
            localStorage.setItem('qtok_telegram_hash', hash || '');
            
            console.log('✅ Data Telegram disimpan dalam localStorage');
            console.log(`ID: ${telegramId}, Nama: ${firstName}`);
        }

        function goBackToBot() {
            // Buka bot Telegram
            window.location.href = 'https://t.me/Hadamard_bot';
        }

        // Auto-redirect ke WebApp asal selepas 3 saat
        setTimeout(() => {
            if (document.referrer && document.referrer.includes('github.io')) {
                window.location.href = document.referrer;
            }
        }, 3000);
    </script>
</body>
</html>
