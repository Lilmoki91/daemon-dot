<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Auth Callback</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #16213e;
            border-radius: 16px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .success { color: #00ff88; }
        .error { color: #e94560; }
        pre { 
            background: #0a0c10; 
            padding: 15px; 
            border-radius: 8px;
            text-align: left;
            overflow-x: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>⏳ Memproses Log Masuk Telegram...</h2>
        <p id="status">Sila tunggu...</p>
        <pre id="debug"></pre>
    </div>

    <script>
        // Dapatkan semua query parameters
        const params = new URLSearchParams(window.location.search);
        
        // Extract data dari Telegram
        const authData = {
            id: params.get('id'),
            first_name: params.get('first_name'),
            last_name: params.get('last_name') || '',
            username: params.get('username') || '',
            photo_url: params.get('photo_url') || '',
            auth_date: params.get('auth_date'),
            hash: params.get('hash')
        };
        
        const statusEl = document.getElementById('status');
        const debugEl = document.getElementById('debug');
        
        // Validasi data
        if (!authData.id || !authData.hash) {
            statusEl.innerHTML = '<p class="error">❌ Authentication data tidak lengkap!</p>';
            debugEl.textContent = JSON.stringify(authData, null, 2);
            console.error('❌ Auth data incomplete:', authData);
            setTimeout(() => {
                window.location.href = 'https://lilmoki91.github.io/daemon-dot/';
            }, 3000);
        } else {
            // Simpan ke sessionStorage
            sessionStorage.setItem('telegramUser', JSON.stringify(authData));
            sessionStorage.setItem('telegramAuth', 'true');
            
            statusEl.innerHTML = '<p class="success">✅ Log masuk berjaya!</p><p>Mengalih semula...</p>';
            debugEl.textContent = `User ID: ${authData.id}\nName: ${authData.first_name} ${authData.last_name}\nUsername: ${authData.username || 'N/A'}\n\n✅ Data disimpan ke sessionStorage`;
            
            console.log('✅ Telegram Auth Success:', authData);
            
            // Redirect ke index.html selepas 1 saat
            setTimeout(() => {
                window.location.href = 'https://lilmoki91.github.io/daemon-dot/';
            }, 1000);
        }
    </script>
</body>
</html>
